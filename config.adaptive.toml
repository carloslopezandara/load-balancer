# Load Balancer Configuration with Adaptive Mode
# This example enables adaptive load balancing

[server]
port = 8080
host = "0.0.0.0"
strategy = "round_robin"
adaptive = true
shutdown_timeout_seconds = 30

[[workers.hosts]]
url = "http://localhost:3001"
enabled = true

[[workers.hosts]]
url = "http://localhost:3002"
enabled = true

[[workers.hosts]]
url = "http://localhost:3003"
enabled = true

[adaptive]
high_latency_ms = 500
high_error_rate = 0.1
min_samples = 10
cooldown_seconds = 60

[logging]
level = "info"
