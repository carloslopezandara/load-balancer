# Load Balancer Configuration with Adaptive Mode
# This example demonstrates switching from least_connections to round_robin
# due to high error rates

[server]
port = 8080
host = "0.0.0.0"
strategy = "least_connections"  # Start with least_connections
adaptive = true
shutdown_timeout_seconds = 30

# Worker 1: Fast but VERY error-prone (25% error rate)
[[workers.hosts]]
url = "http://localhost:3001"
enabled = true
artificial_delay_ms = 100
artificial_error_rate = 0.25

# Worker 2: Fast but error-prone (20% error rate)
[[workers.hosts]]
url = "http://localhost:3002"
enabled = true
artificial_delay_ms = 100
artificial_error_rate = 0.20

# Worker 3: Fast and reliable (0% errors - baseline)
[[workers.hosts]]
url = "http://localhost:3003"
enabled = true
artificial_delay_ms = 100
artificial_error_rate = 0.0

[adaptive]
high_latency_ms = 500  # Latency is not the trigger here
high_error_rate = 0.1  # 10% threshold - workers 1 and 2 exceed this
min_samples = 50  # Ensures EMA convergence with alpha=0.1
cooldown_seconds = 60
evaluation_interval_seconds = 5
ema_alpha = 0.1  # EMA responsiveness: 0.1 = smooth, 0.3 = reactive

[logging]
level = "info"
